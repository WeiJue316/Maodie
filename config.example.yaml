# project_class/config.example.yaml
# 复制此文件为 config.yaml 并填写你的配置。
# API Key 建议放在 .env 文件中（AGENT_API_KEY=xxx），避免提交到版本库。

llm:
  provider: minimax                       # 支持: minimax | deepseek | openai | custom
  api_key: ""                             # 留空则从 AGENT_API_KEY 环境变量读取
  base_url: "https://api.minimax.chat/v1" # MiniMax 兼容 OpenAI 接口
  model: "MiniMax-M2.7"
  temperature: 0.7
  timeout: 60
  max_retries: 3
  streaming: true                         # 启用流式输出

agent:
  max_iterations: 20                      # 单次 loop 最大工具调用轮数
  work_dir: "."                           # 工作目录（相对于 project_class/）
  system_prompt: |
    你是一个智能助手，可以使用工具帮助用户完成任务。
    工作目录为 {work_dir}。
    在使用工具时，请逐步思考并说明你的操作意图。

session:
  dir: ".sessions"                        # Session 文件存储目录
  max_history: 100                        # 单 Session 最多保留消息轮数
  auto_save: true                         # 每轮对话后自动保存

tools:
  enabled:                                # 启用的工具，注释掉即可禁用
    - read_file
    - write_file
    - list_dir
    - change_dir
    - shell
    - search_files

skills:
  dir: "skills"                           # Skill 目录（相对于 project_class/）
  max_skills_in_prompt: 50                # 目录最多包含多少个 skill
  max_prompt_chars: 10000                 # 目录最大字符数（超出自动降级）

observation:
  enabled: true
  db_path: ".memory/memory.db"            # SQLite 数据库路径
  extract_model: ""                       # 空则使用主 LLM 模型
  extract_temperature: 0.3
  max_observations_per_session: 10

vectordb:
  enabled: true
  persist_dir: ".memory/chroma"           # ChromaDB 持久化目录
  embedding_model: "all-MiniLM-L6-v2"
  collection_name: "observations"

memory_search:
  enabled: true
  auto_search: true                       # 每轮对话自动检索
  search_limit: 5                         # 注入 system prompt 的最大条数
  promotion_threshold: 3                  # relevance_count 达到此值时晋升
  auto_promote: true
