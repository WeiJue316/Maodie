llm:
  provider: mimo
  api_key: ''
  base_url: https://token-plan-cn.xiaomimimo.com/v1
  model: mimo-v2.5-pro
  temperature: 0.7
  timeout: 180
  max_retries: 3
  streaming: true
  models:
  - name: MiniMax-M2.7
    provider: minimax
    base_url: https://api.minimax.chat/v1
  - name: deepseek-chat
    provider: deepseek
    base_url: https://api.deepseek.com/v1
  - name: mimo-v2.5-pro
    provider: mimo
    base_url: https://token-plan-cn.xiaomimimo.com/v1
    api_key: ${MIMO_API_KEY}
agent:
  max_iterations: 40
  work_dir: .
  system_prompt: '你是一个智能助手，可以使用工具帮助用户完成任务。

    工作目录为 {work_dir}。

    在使用工具时，请逐步思考并说明你的操作意图。

    '
session:
  dir: .sessions
  max_history: 100
  auto_save: true
tools:
  enabled:
  - read_file
  - write_file
  - list_dir
  - change_dir
  - shell
  - search_files
  - select_skill
  - create_workbook
  - read_workbook
  - edit_cell
  - format_cells
  - manage_sheet
observation:
  enabled: true
  db_path: .memory/memory.db
  extract_model: ''
  extract_temperature: 0.3
  max_observations_per_session: 10
vectordb:
  enabled: true
  persist_dir: .memory/chroma
  embedding_model: BAAI/bge-small-zh-v1.5
  collection_name: observations
memory_search:
  enabled: true
  auto_search: true
  search_limit: 5
  promotion_threshold: 3
  auto_promote: true
skills:
  dir: agent-skills
agents:
  architect:
    system_prompt: |
      你是一个软件架构师，负责分析需求、设计模块结构、定义接口。
      输出应该包含：模块划分、接口定义、数据结构、技术选型理由。
    max_iterations: 15
  coder:
    system_prompt: |
      你是一个高级开发者，根据设计规格编写实现代码。
      要求：代码风格一致、有必要的错误处理、遵循项目约定。
    max_iterations: 30
  reviewer:
    system_prompt: |
      你是一个代码审查专家，检查代码质量、安全性和可维护性。
      输出格式：问题列表，每个问题包含文件位置、问题描述、修复建议。
    tools: [read_file, list_dir, search_files]
    max_iterations: 10
orchestrator:
  enabled: true
  task_timeout: 300
  max_concurrent_tasks: 3
  max_result_chars: 12000
  task_retention_seconds: 3600
mcp_servers:
- name: amap-maps
  transport: streamable_http
  url: https://mcp.api-inference.modelscope.net/ecdae30ea89645/mcp
  timeout: 30
- name: 12306
  transport: streamable_http
  url: https://mcp.api-inference.modelscope.net/738675594f2b44/mcp
  timeout: 30
- name: fetch
  transport: sse
  url: https://mcp-.api-inference.modelscope.net/sse
  timeout: 30
